<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Edge-to-Edge Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Modern Invisible Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* Smooth Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#F8FAFC] text-slate-800 flex select-none antialiased">

    <!-- ========================================== -->
    <!-- 1. AUTHENTICATION OVERLAY (Fullscreen)     -->
    <!-- ========================================== -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-[#F8FAFC] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-100/60 via-slate-50 to-pink-100/60 flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[32px] shadow-[0_20px_60px_-15px_rgba(79,70,229,0.15)] w-full max-w-[420px] border border-slate-100 animate-fade-up relative">

            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-[20px] flex items-center justify-center mb-5 shadow-lg shadow-indigo-500/25">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Nexus Workspace</h1>
                <p class="text-sm text-slate-500 mt-1 font-medium">Secure Encrypted Communication</p>
            </div>

            <!-- Error Banner (Hidden by default) -->
            <div id="auth-error" class="hidden mb-6 p-3.5 rounded-2xl bg-rose-50 border border-rose-100 text-rose-600 text-xs font-semibold text-center animate-fade-up"></div>

            <!-- Tab Switcher -->
            <div class="flex bg-slate-100/80 rounded-2xl p-1.5 mb-8">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition-all">Log In</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl text-slate-500 hover:text-slate-700 transition-all">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Username</label>
                    <input type="text" id="loginUsername" required autocomplete="off" class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="off" class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm transition-all">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all mt-4">Access Workspace</button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-5 hidden">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Unique Username</label>
                    <input type="text" id="regUsername" required autocomplete="off" placeholder="e.g. elliot_alderson" class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Email Address</label>
                    <input type="email" id="regEmail" required autocomplete="off" placeholder="name@domain.com" class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Password</label>
                    <input type="password" id="regPassword" required autocomplete="off" class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm transition-all">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all mt-4">Create Unique Identity</button>
            </form>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. FULL-SCREEN WORKSPACE LAYOUT (100w/100h) -->
    <!-- ========================================== -->
    <div id="chat-screen" class="hidden h-screen w-screen overflow-hidden flex bg-[#F8FAFC]">

        <!-- Tier 1: Primary Utility Nav (72px) -->
        <nav class="w-[72px] bg-white border-r border-slate-200/60 flex flex-col items-center py-5 justify-between shrink-0 z-30">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20 cursor-pointer">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="flex flex-col gap-3 my-auto">
                <button class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></button>
            </div>
            <div class="relative group cursor-pointer" onclick="openProfileModal()">
                <img id="nav-user-avatar" src="" class="w-10 h-10 rounded-2xl object-cover ring-2 ring-indigo-500/20 group-hover:ring-indigo-500 transition-all">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white"></div>
            </div>
        </nav>

        <!-- Tier 2: Secondary Context / Chat List (280px) -->
        <aside class="w-[280px] bg-slate-50/70 backdrop-blur-md border-r border-slate-200/60 flex flex-col shrink-0 z-20">
            <div class="h-16 px-5 border-b border-slate-200/60 flex items-center justify-between shrink-0">
                <span class="font-bold text-sm tracking-tight text-slate-900">Nexus Workspace</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">PRO</span>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
                <div>
                    <div class="px-3 mb-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Channels</div>
                    <div class="space-y-0.5">
                        <div class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-medium text-xs shadow-sm shadow-indigo-500/20">
                            <span class="flex items-center gap-2"># global-relay</span>
                            <span class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded-md">Live</span>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="px-3 mb-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Active Members</div>
                    <div id="sidebar-online-users" class="space-y-1"></div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-200/60 shrink-0">
                <button onclick="logout()" class="w-full bg-white hover:bg-rose-50 border border-slate-200 text-slate-600 hover:text-rose-600 text-xs font-semibold py-3 rounded-xl transition-all shadow-sm">Terminate Session</button>
            </div>
        </aside>

        <!-- Tier 3: Active Workspace / Chat Canvas (Fluid Flex-1) -->
        <main class="flex-1 flex flex-col bg-white relative overflow-hidden">
            <!-- Sticky Glass Header -->
            <header class="h-16 px-8 border-b border-slate-200/60 flex items-center justify-between glass-panel absolute top-0 w-full z-10 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold">#</div>
                    <div>
                        <h2 class="text-sm font-bold text-slate-900">global-relay</h2>
                        <p class="text-[11px] text-slate-400 font-medium">End-to-end encrypted channel</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] text-emerald-700 font-bold tracking-wider uppercase">Connected</span>
                </div>
            </header>

            <!-- Messages Scroll Area -->
            <div id="chat-box" class="flex-1 overflow-y-auto px-8 py-6 space-y-6 flex flex-col pt-24 pb-28"></div>

            <!-- Floating Input Dock -->
            <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-white via-white/90 to-transparent shrink-0 z-20">
                <form onsubmit="sendMessage(event)" class="max-w-4xl mx-auto bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 shadow-sm focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-500 transition-all flex items-end gap-3">
                    <textarea id="messageText" rows="1" placeholder="Message #global-relay..." oninput="autoResizeTextarea(this)" onkeydown="handleInputKeydown(event)" class="flex-1 bg-transparent border-0 focus:outline-none focus:ring-0 text-sm text-slate-800 placeholder-slate-400 resize-none max-h-32 py-2 px-2"></textarea>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl shadow-md shadow-indigo-500/25 transition-all transform active:scale-95 shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>


    <!-- ========================================== -->
    <!-- 3. PROFILE SETTINGS MODAL                  -->
    <!-- ========================================== -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white w-full max-w-lg rounded-[28px] shadow-2xl border border-slate-100 overflow-hidden flex flex-col p-8" id="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-slate-900">Workspace Settings</h3>
                <button onclick="closeProfileModal()" class="p-2 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="profile-form" onsubmit="submitProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Update Avatar File</label>
                    <input type="file" id="profilePic" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 transition-all cursor-pointer bg-slate-50 border border-slate-200 rounded-xl p-1">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">About Me (Bio)</label>
                    <textarea id="profileBio" rows="3" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 resize-none" placeholder="Engineer at Nexus..."></textarea>
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeProfileModal()" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-md shadow-indigo-500/25 hover:bg-indigo-500 transition-all">Save Changes</button>
                </div>
            </form>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 4. APPLICATION LOGIC (JavaScript)          -->
    <!-- ========================================== -->
    <script>
        const API_BASE = "https://nexus-9q5s.onrender.com";
        const WS_BASE = "wss://nexus-9q5s.onrender.com";

        let ws;
        let currentUsername = localStorage.getItem("chat_username") || "";
        let currentToken = localStorage.getItem("chat_token") || "";

        window.onload = function() {
            if (currentUsername && currentToken) {
                initWorkspace(currentUsername, currentToken);
            }
        };

        function showError(msg) {
            let errBox = document.getElementById("auth-error");
            errBox.innerText = msg;
            errBox.classList.remove("hidden");
            setTimeout(() => { errBox.classList.add("hidden"); }, 5000);
        }

        function switchTab(tab) {
            document.getElementById("auth-error").classList.add("hidden");
            document.getElementById("login-form").style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById("register-form").style.display = tab === 'register' ? 'block' : 'none';

            document.getElementById("tab-login").className = tab === 'login'
                ? "flex-1 py-2.5 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition-all"
                : "flex-1 py-2.5 text-sm font-semibold rounded-xl text-slate-500 hover:text-slate-700 transition-all";

            document.getElementById("tab-register").className = tab === 'register'
                ? "flex-1 py-2.5 text-sm font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition-all"
                : "flex-1 py-2.5 text-sm font-semibold rounded-xl text-slate-500 hover:text-slate-700 transition-all";
        }

        async function handleRegister(event) {
            event.preventDefault();
            let username = document.getElementById("regUsername").value.trim();
            let email = document.getElementById("regEmail").value.trim();
            let password = document.getElementById("regPassword").value;

            try {
                let response = await fetch(`${API_BASE}/users/`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                let data = await response.json();

                if (response.ok) {
                    alert("Account created successfully! Please log in with your credentials.");
                    document.getElementById("loginUsername").value = username;
                    document.getElementById("loginPassword").value = password;
                    switchTab('login');
                } else {
                    showError(data.detail || "Registration failed.");
                }
            } catch (err) {
                showError("Server connection error.");
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            let username = document.getElementById("loginUsername").value.trim();
            let password = document.getElementById("loginPassword").value;
            let formData = new URLSearchParams();
            formData.append("username", username); formData.append("password", password);

            try {
                let response = await fetch(`${API_BASE}/login`, {
                    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formData
                });

                if (!response.ok) {
                    showError("Invalid username or password.");
                    return;
                }

                let data = await response.json();
                localStorage.setItem("chat_token", data.access_token);
                localStorage.setItem("chat_username", data.username);
                initWorkspace(data.username, data.access_token);
            } catch (err) {
                showError("Server connection error.");
            }
        }

        async function initWorkspace(username, token) {
            currentUsername = username; currentToken = token;
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("chat-screen").classList.remove("hidden");

            await loadMyProfile();
            await loadChatHistory();

            ws = new WebSocket(`${WS_BASE}/ws/${username}?token=${token}`);
            ws.onmessage = function(event) {
                let data = JSON.parse(event.data);
                if (data.type === "users_list") {
                    updateOnlineUsers(data.users);
                } else {
                    appendMessageToUI(data);
                }
            };
        }

        async function loadMyProfile() {
            try {
                let res = await fetch(`${API_BASE}/profile/${currentUsername}`);
                if (res.ok) {
                    let data = await res.json();
                    document.getElementById("nav-user-avatar").src = data.profile_pic;
                    document.getElementById("profileBio").value = data.bio;
                }
            } catch(e) {}
        }

        function openProfileModal() { document.getElementById("profile-modal").classList.remove("hidden"); }
        function closeProfileModal() { document.getElementById("profile-modal").classList.add("hidden"); }

        async function submitProfile(event) {
            event.preventDefault();
            let formData = new FormData();
            formData.append("token", currentToken);
            formData.append("bio", document.getElementById("profileBio").value);
            let fileInput = document.getElementById("profilePic");
            if(fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

            try {
                let response = await fetch(`${API_BASE}/profile/`, { method: "POST", body: formData });
                if(response.ok) {
                    alert("Profile updated successfully!");
                    closeProfileModal();
                    await loadMyProfile();
                } else { alert("Failed to update profile."); }
            } catch(e) { alert("Server upload error."); }
        }

        function updateOnlineUsers(users) {
            let container = document.getElementById("sidebar-online-users");
            container.innerHTML = users.map(u => {
                let isMe = (u === currentUsername);
                let label = isMe ? `${u} (YOU)` : u;
                return `
                <div class="flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-slate-200/40 cursor-pointer transition-colors group">
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${u}" class="w-7 h-7 rounded-xl object-cover">
                        <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-white"></div>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-slate-900 transition-colors">@${label}</span>
                </div>`;
            }).join('');
        }

        async function loadChatHistory() {
            try {
                let res = await fetch(`${API_BASE}/messages/`);
                if (res.ok) {
                    let messages = await res.json();
                    let chatBox = document.getElementById("chat-box");
                    chatBox.innerHTML = "";
                    messages.forEach(msg => {
                        appendMessageToUI({
                            type: "chat", sender: "User " + msg.owner_id, content: msg.content,
                            time: "History", pfp: "https://api.dicebear.com/7.x/identicon/svg?seed=History"
                        });
                    });
                }
            } catch(e) {}
        }

        function appendMessageToUI(data) {
            let chatBox = document.getElementById("chat-box");
            let div = document.createElement("div");
            div.className = "animate-fade-up flex items-end gap-3 w-full";

            if (data.type === "system") {
                div.className = "animate-fade-up flex justify-center my-2 w-full";
                div.innerHTML = `<span class="bg-slate-100 text-slate-500 text-[11px] font-semibold px-4 py-1 rounded-full border border-slate-200">${data.content}</span>`;
            }
            else if (data.type === "chat") {
                let isMe = data.sender === currentUsername;
                if (isMe) div.className += " flex-row-reverse";

                let avatarUrl = data.pfp || `https://api.dicebear.com/7.x/identicon/svg?seed=${data.sender}`;

                div.innerHTML = `
                    <img src="${avatarUrl}" class="w-8 h-8 rounded-xl object-cover shrink-0 shadow-sm border border-slate-200">
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[70%]">
                        <div class="flex items-center gap-2 mb-1 px-1">
                            <span class="text-xs font-bold text-slate-700">@${data.sender}</span>
                            <span class="text-[10px] text-slate-400">${data.time || ""}</span>
                        </div>
                        <div class="px-4 py-3 text-sm leading-relaxed shadow-sm ${isMe ? 'bg-indigo-600 text-white rounded-2xl rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-2xl rounded-bl-sm'}">
                            ${data.content}
                        </div>
                    </div>
                `;
            }

            chatBox.appendChild(div);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function handleInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        }

        function sendMessage(event) {
            event.preventDefault();
            let input = document.getElementById("messageText");
            if (ws && ws.readyState === WebSocket.OPEN && input.value.trim() !== "") {
                ws.send(input.value);
                input.value = "";
                input.style.height = 'auto';
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
