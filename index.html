<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Premium Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 h-screen w-screen overflow-hidden flex antialiased relative">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 transition-colors duration-300">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-200 dark:border-gray-700">
            <div class="text-center mb-6">
                <div class="w-12 h-12 mx-auto bg-blue-600 rounded-xl flex items-center justify-center mb-4"><span class="text-2xl text-white">🌍</span></div>
                <h1 class="text-2xl font-bold">Nexus Workspace</h1>
            </div>
            <p id="auth-status" class="text-center text-sm font-semibold mb-4 text-red-500"></p>
            <div class="flex gap-2 bg-gray-100 dark:bg-gray-700 p-1 rounded-xl mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-gray-800 shadow text-blue-600">Login</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 dark:text-gray-400">Register</button>
            </div>
            <!-- Login Form (No Reload Check Added) -->
            <form id="login-form" class="space-y-4">
                <input type="text" id="loginUsername" placeholder="Username" required class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="loginPassword" placeholder="Password" required class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">Enter</button>
            </form>
            <!-- Register Form -->
            <form id="register-form" class="space-y-4 hidden">
                <input type="text" id="regUsername" placeholder="Choose Username" required class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="email" id="regEmail" placeholder="Email" required class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="regPassword" placeholder="Password" required class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition-all">Create Account</button>
            </form>
        </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div id="main-workspace" class="hidden w-full h-full flex">

        <!-- Sidebar -->
        <aside class="w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-20">
            <div class="h-16 px-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between shrink-0">
                <div onclick="openProfileModal()" class="flex items-center gap-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 p-2 rounded-lg transition-colors relative">
                    <div class="relative">
                        <img id="my-avatar" src="" class="w-10 h-10 rounded-full bg-gray-100 border-2 border-gray-200 dark:border-gray-600 object-cover">
                        <div id="notif-badge" class="hidden absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-white dark:border-gray-800 rounded-full"></div>
                    </div>
                    <div>
                        <span id="my-username-display" class="font-bold text-sm block"></span>
                        <span class="text-[10px] text-gray-500 font-medium uppercase">View Profile & Friends</span>
                    </div>
                </div>
                <div class="flex gap-1">
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                        <svg class="w-4 h-4 text-gray-500 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <svg class="w-4 h-4 text-amber-500 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <button onclick="logout()" class="p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 text-red-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </div>
            </div>

            <!-- Sidebar Lists -->
            <div class="flex-1 overflow-y-auto py-4">
                <div class="px-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Workspaces</div>
                <div class="px-2 space-y-1 mb-6">
                    <div onclick="selectChat('global')" id="btn-global" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 cursor-pointer transition-colors">
                        <span class="text-xl">🌍</span><span class="text-sm font-medium">Global Relay</span>
                    </div>
                </div>

                <div class="px-4 mb-2 flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Direct Messages</span>
                </div>
                <div id="friends-list" class="px-2 space-y-1"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-white dark:bg-gray-900 z-10">
            <header class="h-16 px-6 border-b border-gray-200 dark:border-gray-700 flex items-center gap-3 shrink-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm">
                <div id="chat-header-icon" class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-xl">🌍</div>
                <div>
                    <h2 id="chat-header-title" class="text-sm font-semibold">Global Relay</h2>
                    <p id="chat-header-sub" class="text-xs text-green-500 font-medium">Public Secure Chat</p>
                </div>
            </header>

            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900">
                <!-- Chat Form with ID to prevent default reload -->
                <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-2 bg-gray-100 dark:bg-gray-800 p-1.5 rounded-2xl border border-gray-200 dark:border-gray-700">
                    <input type="text" id="messageText" placeholder="Write a message..." autocomplete="off" class="flex-1 bg-transparent border-0 focus:ring-0 text-sm py-2.5 px-4 outline-none">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl transition-colors shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- PROFILE / FRIENDS MODAL -->
    <div id="profile-modal" class="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="text-lg font-bold">Profile & Friends</h3>
                <button onclick="closeProfileModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="flex flex-col items-center mb-8">
                    <img id="modal-avatar" src="" class="w-20 h-20 rounded-full border-4 border-gray-100 dark:border-gray-700 mb-3">
                    <h2 id="modal-username" class="text-xl font-bold"></h2>
                    <div class="flex gap-4 mt-2 text-sm">
                        <div class="text-center"><span id="friend-count" class="font-bold block text-lg">0</span><span class="text-gray-500">Friends</span></div>
                    </div>
                </div>
                <div class="flex gap-2 border-b border-gray-200 dark:border-gray-700 mb-4 pb-2">
                    <button onclick="switchModalTab('search')" id="tab-modal-search" class="text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2 flex-1">Find Friends</button>
                    <button onclick="switchModalTab('requests')" id="tab-modal-requests" class="text-sm font-semibold text-gray-500 pb-2 flex-1 relative">
                        Requests
                        <span id="modal-req-badge" class="hidden absolute top-0 right-4 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                </div>
                <div id="modal-search-section">
                    <div class="flex gap-2">
                        <input type="text" id="searchUserInput" placeholder="Enter exact username..." class="flex-1 px-4 py-2.5 text-sm rounded-xl bg-gray-100 dark:bg-gray-700 border-none outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="searchAndAddUser()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold transition-colors text-sm">Send Request</button>
                    </div>
                    <p id="search-status" class="text-xs mt-3 text-center"></p>
                </div>
                <div id="modal-requests-section" class="hidden h-40 overflow-y-auto">
                    <div id="pending-list" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://nexus-9q5s.onrender.com";
        const WS_GLOBAL = "wss://nexus-9q5s.onrender.com/ws";
        const WS_PRIVATE = "wss://nexus-9q5s.onrender.com/ws/private";

        let wsGlobal;
        let wsPrivate;
        let currentUser = localStorage.getItem("nexus_user");

        // Sticky Chat Memory: Pehle wali state yaad rakhega
        let currentChatType = localStorage.getItem("last_chat_type") || 'global';
        let currentChatTarget = localStorage.getItem("last_chat_target") || null;

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); }
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }

        window.onload = () => { if (currentUser) { startWorkspace(currentUser); } };

        function switchTab(tab) {
            document.getElementById("auth-status").innerText = "";
            document.getElementById("login-form").classList.toggle("hidden", tab !== 'login');
            document.getElementById("register-form").classList.toggle("hidden", tab !== 'register');
        }

        // Secure Form Submit for Auth (Prevents Reload)
        document.getElementById("login-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value;
            try {
                const res = await fetch(`${API_BASE}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (res.ok) { localStorage.setItem("nexus_user", username); startWorkspace(username); }
                else { document.getElementById("auth-status").style.color = "red"; document.getElementById("auth-status").innerText = data.detail; }
            } catch (err) { document.getElementById("auth-status").innerText = "Error."; }
        });

        document.getElementById("register-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("regUsername").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            try {
                const res = await fetch(`${API_BASE}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password }) });
                const data = await res.json();
                if (res.ok) { document.getElementById("auth-status").style.color = "green"; document.getElementById("auth-status").innerText = "Success! Please login."; switchTab('login'); }
                else { document.getElementById("auth-status").style.color = "red"; document.getElementById("auth-status").innerText = data.detail; }
            } catch (err) { document.getElementById("auth-status").innerText = "Error."; }
        });

        function startWorkspace(username) {
            currentUser = username;
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("main-workspace").classList.remove("hidden");
            document.getElementById("my-username-display").innerText = username;
            document.getElementById("my-avatar").src = `https://api.dicebear.com/7.x/notionists/svg?seed=${username}`;
            document.getElementById("modal-avatar").src = `https://api.dicebear.com/7.x/notionists/svg?seed=${username}`;
            document.getElementById("modal-username").innerText = username;

            loadFriendsAndRequests();
            connectGlobalWS();
            connectPrivateWS();

            // Open exactly the chat you were in last time
            if (currentChatType === 'private' && currentChatTarget) {
                selectChat('private', currentChatTarget);
            } else {
                selectChat('global');
            }
        }

        // WebSockets with Auto-Reconnect Logic
        function connectGlobalWS() {
            wsGlobal = new WebSocket(WS_GLOBAL);
            wsGlobal.onmessage = (event) => {
                if (currentChatType === 'global') renderMessage(JSON.parse(event.data));
            };
            wsGlobal.onclose = () => { setTimeout(connectGlobalWS, 3000); }; // Auto-Reconnect
        }

        function connectPrivateWS() {
            wsPrivate = new WebSocket(`${WS_PRIVATE}/${currentUser}`);
            wsPrivate.onmessage = (event) => {
                let msg = JSON.parse(event.data);

                // Ensures message only shows in the exact active window
                const isRelevant =
                    (msg.sender === currentChatTarget && msg.receiver === currentUser) ||
                    (msg.sender === currentUser && msg.receiver === currentChatTarget);

                if (currentChatType === 'private' && isRelevant) {
                    renderMessage(msg);
                }
            };
            wsPrivate.onclose = () => { setTimeout(connectPrivateWS, 3000); }; // Auto-Reconnect
        }

        function openProfileModal() { document.getElementById("profile-modal").classList.remove("hidden"); }
        function closeProfileModal() { document.getElementById("profile-modal").classList.add("hidden"); }

        function switchModalTab(tab) {
            document.getElementById("modal-search-section").classList.toggle("hidden", tab !== 'search');
            document.getElementById("modal-requests-section").classList.toggle("hidden", tab !== 'requests');
            document.getElementById("tab-modal-search").className = tab === 'search' ? "text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2 flex-1" : "text-sm font-semibold text-gray-500 pb-2 flex-1";
            document.getElementById("tab-modal-requests").className = tab === 'requests' ? "text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2 flex-1 relative" : "text-sm font-semibold text-gray-500 pb-2 flex-1 relative";
        }

        async function searchAndAddUser() {
            const input = document.getElementById("searchUserInput");
            const status = document.getElementById("search-status");
            if(!input.value.trim()) return;
            status.innerText = "Sending..."; status.style.color = "gray";

            try {
                const res = await fetch(`${API_BASE}/friends/request/send`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender_username: currentUser, receiver_username: input.value.trim() })
                });
                const data = await res.json();
                status.innerText = res.ok ? "Friend request sent successfully!" : data.detail;
                status.style.color = res.ok ? "green" : "red";
                input.value = "";
                setTimeout(() => { status.innerText = ""; }, 3000);
            } catch (err) { status.innerText = "Error."; }
        }

        async function loadFriendsAndRequests() {
            try {
                const resReq = await fetch(`${API_BASE}/friends/requests/pending/${currentUser}`);
                if (resReq.ok) {
                    const reqs = await resReq.json();
                    const hasReqs = reqs.length > 0;
                    document.getElementById("notif-badge").classList.toggle("hidden", !hasReqs);
                    document.getElementById("modal-req-badge").classList.toggle("hidden", !hasReqs);

                    const pendingList = document.getElementById("pending-list");
                    if (hasReqs) {
                        pendingList.innerHTML = reqs.map(r => `
                            <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600">
                                <div class="flex items-center gap-2">
                                    <img src="https://api.dicebear.com/7.x/notionists/svg?seed=${r.sender_username}" class="w-8 h-8 rounded-full">
                                    <span class="text-sm font-semibold">@${r.sender_username}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="respondRequest(${r.request_id}, 'accepted')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Accept</button>
                                    <button onclick="respondRequest(${r.request_id}, 'rejected')" class="bg-gray-200 dark:bg-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold">Ignore</button>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        pendingList.innerHTML = `<p class="text-center text-sm text-gray-500 mt-4">No pending requests</p>`;
                    }
                }
            } catch(e) {}

            try {
                const resFriends = await fetch(`${API_BASE}/friends/list/${currentUser}`);
                if (resFriends.ok) {
                    const friends = await resFriends.json();
                    document.getElementById("friend-count").innerText = friends.length;

                    const friendsList = document.getElementById("friends-list");
                    friendsList.innerHTML = friends.map(f => `
                        <div onclick="selectChat('private', '${f.username}')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700/50 cursor-pointer transition-colors group ${currentChatTarget === f.username ? 'bg-gray-100 dark:bg-gray-700/50' : ''}">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=${f.username}" class="w-8 h-8 rounded-full border border-gray-200 dark:border-gray-600 group-hover:border-blue-400">
                            <h4 class="text-sm font-medium truncate">${f.username}</h4>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        async function respondRequest(reqId, action) {
            try {
                await fetch(`${API_BASE}/friends/request/respond`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request_id: reqId, action: action }) });
                loadFriendsAndRequests();
            } catch(e) {}
        }

        async function selectChat(type, target = null) {
            currentChatType = type;
            currentChatTarget = target;

            // Save state in LocalStorage to prevent reset on refresh
            localStorage.setItem("last_chat_type", type);
            if (target) localStorage.setItem("last_chat_target", target);

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";

            // Re-render friends list to highlight the active chat
            loadFriendsAndRequests();

            if(type === 'global') {
                document.getElementById("btn-global").classList.add("bg-blue-50", "dark:bg-blue-900/30", "text-blue-600", "dark:text-blue-400");
                document.getElementById("chat-header-icon").innerHTML = "🌍";
                document.getElementById("chat-header-title").innerText = "Global Relay";
                document.getElementById("chat-header-sub").innerText = "Public Secure Chat";
            } else {
                document.getElementById("btn-global").classList.remove("bg-blue-50", "dark:bg-blue-900/30", "text-blue-600", "dark:text-blue-400");
                document.getElementById("chat-header-icon").innerHTML = `<img src="https://api.dicebear.com/7.x/notionists/svg?seed=${target}" class="w-full h-full rounded-full">`;
                document.getElementById("chat-header-title").innerText = target;
                document.getElementById("chat-header-sub").innerText = "End-to-End Encrypted";

                try {
                    const res = await fetch(`${API_BASE}/messages/private/${currentUser}/${target}`);
                    if(res.ok) {
                        const history = await res.json();
                        history.forEach(msg => renderMessage(msg));
                    }
                } catch(e) {}
            }
        }

        function renderMessage(data) {
            const chatBox = document.getElementById("chat-box");
            const isMe = data.sender === currentUser;
            const msgDiv = document.createElement("div");

            msgDiv.className = `flex items-end gap-2 max-w-lg ${isMe ? 'ml-auto flex-row-reverse' : ''}`;
            msgDiv.innerHTML = `
                <img src="https://api.dicebear.com/7.x/notionists/svg?seed=${data.sender}" class="w-8 h-8 rounded-full border border-gray-200 dark:border-gray-700 shrink-0">
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[10px] text-gray-500 mb-1 px-1">@${data.sender}</span>
                    <div class="${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-bl-none'} px-4 py-2.5 rounded-2xl text-sm shadow-sm break-words max-w-full">
                        ${data.content}
                    </div>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Bulletproof Chat Form Submission
        document.getElementById("chat-form").addEventListener("submit", function(e) {
            e.preventDefault(); // Prevents page reload 100%
            const input = document.getElementById("messageText");
            const content = input.value.trim();
            if (content === "") return;

            if (currentChatType === 'global' && wsGlobal && wsGlobal.readyState === WebSocket.OPEN) {
                wsGlobal.send(JSON.stringify({ sender: currentUser, content: content }));
            } else if (currentChatType === 'private' && wsPrivate && wsPrivate.readyState === WebSocket.OPEN) {
                wsPrivate.send(JSON.stringify({ receiver: currentChatTarget, content: content }));
            } else {
                alert("Connecting to secure server... Please try sending again in 2 seconds.");
            }
            input.value = "";
        });

        function logout() {
            localStorage.removeItem("nexus_user");
            localStorage.removeItem("last_chat_type");
            localStorage.removeItem("last_chat_target");
            location.reload();
        }
    </script>
</body>
</html>
